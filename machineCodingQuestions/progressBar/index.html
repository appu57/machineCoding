<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles.css" rel="stylesheet">
    <title>Progress Bar</title>
</head>
<body>
    <div class="wrapper">
        <div class="progress__bar" id="progress"></div>
        <div class="button__container">
            <button class="btn" id="btn_add">Add</button>
            <button class="btn_remove" id="btn_reduce">Reduce</button>

        </div>
    </div>

    <p>WAAY 2</p>
    <div class="wrapper">
        <div class="progress__bar__style2" id="progress__bar__style2"> <!--One outer container and keep increasing width of inner container with some background color-->
            <div class="progress__inner__bar" id="progress__inner__bar">

            </div>
        </div>
        <div class="button__container"></div>
            <button class="btn" id="btn_add__style2">Add</button>
            <button class="btn_remove" id="btn_reduce__style2">Reduce</button>

        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
